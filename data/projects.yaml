  tags: [go]
- name: pr-watcher
  summary: "A Claude Code mod that keeps watching your pull requests in a pane next to the chat."
  repo: "https://github.com/Skarlso/pr-watcher"
  tags: [ai]
- name: Google OAuth Go sample
  summary: "A sample for doing Google OAuth in Go with a web app."
  repo: "https://github.com/Skarlso/google-oauth-go-sample"
  tags: [go]

