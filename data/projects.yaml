  repo: "https://github.com/kube-project"
  tags: [go, python, kubernetes]
- name: DaggerStrahd
  summary: "The Curse of Strahd module ported over to the Daggerheart play system."
  site: "https://daggerstrahd.github.io/"
  tags: [ttrpg]
- name: devstats
  summary: "A card for your GitHub README."
  site: "https://devstats.app/"
