  tags: [go, kubernetes]
- name: Adventure Voter
  summary: "A choose-your-own-adventure presentation framework. The audience votes, the talk follows."
  site: "https://adventure-voter.github.io/"
  repo: "https://github.com/Skarlso/adventure-voter"
  tags: [go, talks]
- name: crd-bootstrap
